// CPMA (Challenge ProMode Arena) server config.
// Seeded into Q3_HOME/base/cpma/server.cfg on first start only.
// Edit that copy afterwards and run: systemctl restart cz-quake3
seta sv_hostname "Appgate Quake 3 CPMA"
seta sv_maxclients 12
seta sv_fps 40
seta g_motd "Challenge ProMode Arena on Appgate"
seta sv_master1 ""
seta rconpassword ""

// Physics: CPM (fast air control, ProMode) or VQ3 (vanilla Quake 3).
set server_gameplay "CPM"
// Starting mode. Players can change it with: callvote mode <1v1|2v2|TDM|FFA>
// (CTF needs CTF maps, which the demo content doesn't include.)
set mode_start "FFA"
seta g_allowVote 1

// CPMA arena maps plus the demo and point-release maps.
set d1 "map cpm22 ; set nextmap vstr d2"
set d2 "map cpm3a ; set nextmap vstr d3"
set d3 "map pro-q3dm6 ; set nextmap vstr d4"
set d4 "map cpm1a ; set nextmap vstr d5"
set d5 "map q3dm17 ; set nextmap vstr d6"
set d6 "map pro-q3dm13 ; set nextmap vstr d7"
set d7 "map pro-q3tourney2 ; set nextmap vstr d1"
vstr d1
